name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Build package
        run: yarn prepare

      - name: Verify compiled output is StyleX-clean
        run: |
          if grep -rl 'css\.create(' lib/module/; then
            echo "::error::Uncompiled css.create calls found in lib/module"
            exit 1
          fi

  # Re-enable when the library stabilizes:
  # - build-android: full Gradle build of the example app
  # - build-ios:     xcodebuild of the example app
  # - build-web:     needs postcss-react-strict-dom configured first
